name: Autograding
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Make the activity root importable so `from app.xxx import ...` resolves
  # whether student code is run as a script (`python app/main.py`) or as a
  # module (`python -m app.main`). Without this, absolute-package imports
  # like `from app.schemas import VALID_CATEGORIES` raise ModuleNotFoundError
  # when the script is invoked directly, because Python only puts the script's
  # own directory (app/) on sys.path, not the repository root. See Activity 3
  # and Activity 7 incident, 2026-04-14.
  PYTHONPATH: ${{ github.workspace }}
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
  AZURE_AI_VISION_ENDPOINT: ${{ secrets.AZURE_AI_VISION_ENDPOINT }}
  AZURE_AI_VISION_KEY: ${{ secrets.AZURE_AI_VISION_KEY }}
  AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}
  AZURE_DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_KEY }}
  STUDENT_CORPUS_SEED: ${{ github.actor }}

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env file for autograder
        shell: bash
        run: |
          {
            echo "AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT"
            echo "AZURE_OPENAI_API_KEY=$AZURE_OPENAI_API_KEY"
            echo "AZURE_OPENAI_DEPLOYMENT=$AZURE_OPENAI_DEPLOYMENT"
            echo "AZURE_AI_VISION_ENDPOINT=$AZURE_AI_VISION_ENDPOINT"
            echo "AZURE_AI_VISION_KEY=$AZURE_AI_VISION_KEY"
            echo "AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=$AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT"
            echo "AZURE_DOCUMENT_INTELLIGENCE_KEY=$AZURE_DOCUMENT_INTELLIGENCE_KEY"
            echo "STUDENT_CORPUS_SEED=$STUDENT_CORPUS_SEED"
          } > .env

      - name: Run student code
        run: python app/main.py
        continue-on-error: true

      - name: Clone autograder
        uses: actions/checkout@v4
        with:
          repository: Tech901/ai102-autograder-tests
          token: ${{ secrets.AUTOGRADER_PAT }}
          path: .autograder

      # --- 42 tests, 100 points ---
